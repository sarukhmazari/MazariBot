<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MazariBot - Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-box glass">
            <h2><i class="fa-solid fa-lock"></i> Secure Login</h2>
            <p>Enter your API Key to access the dashboard</p>
            <input type="password" id="apiKeyInput" placeholder="Enter API Key...">
            <button id="loginBtn">Access Dashboard <i class="fa-solid fa-arrow-right"></i></button>
        </div>
    </div>

    <div class="dashboard-container" id="dashboard" style="display: none;">
        <!-- Sidebar -->
        <aside class="sidebar glass">
            <div class="logo">
                <h1>Mazari<span>Bot</span></h1>
            </div>
            <nav>
                <a href="#" class="active"><i class="fa-solid fa-chart-line"></i> Overview</a>
                <a href="#broadcast"><i class="fa-solid fa-bullhorn"></i> Broadcast</a>
                <a href="#sessions"><i class="fa-solid fa-mobile-screen"></i> Sessions</a>
                <a href="#" id="logoutBtn" style="margin-top: auto;"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="content">
            <header class="glass">
                <h2>Dashboard Overview</h2>
                <div class="status-indicator">
                    <div class="pulse"></div>
                    <span id="botStatus">Online</span>
                </div>
            </header>

            <!-- Stats Grid -->
            <div class="stats-grid">
                <div class="stat-card glass">
                    <div class="stat-icon"><i class="fa-solid fa-clock"></i></div>
                    <div class="stat-info">
                        <h3>Uptime</h3>
                        <p id="uptimeVal">Loading...</p>
                    </div>
                </div>
                <div class="stat-card glass">
                    <div class="stat-icon"><i class="fa-solid fa-memory"></i></div>
                    <div class="stat-info">
                        <h3>Memory Usage</h3>
                        <p id="memoryVal">Loading...</p>
                    </div>
                </div>
                <div class="stat-card glass">
                    <div class="stat-icon"><i class="fa-solid fa-users"></i></div>
                    <div class="stat-info">
                        <h3>Active Sessions</h3>
                        <p id="sessionsVal">Loading...</p>
                    </div>
                </div>
            </div>

            <!-- Controls Section -->
            <div class="controls-section glass">
                <h3><i class="fa-solid fa-paper-plane"></i> Send Message / Broadcast</h3>
                <div class="form-group">
                    <label>Target Number (with country code, no +)</label>
                    <input type="text" id="targetNum" placeholder="e.g. 923001234567">
                </div>
                <div class="form-group">
                    <label>Message Content</label>
                    <textarea id="messageText" rows="4" placeholder="Type your message here..."></textarea>
                </div>
                <button id="sendMsgBtn" class="primary-btn">Send Message <i class="fa-solid fa-paper-plane"></i></button>
                <div id="toast" class="toast"></div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
